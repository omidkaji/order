<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ثبت سفارش کره</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --cream:#FBF4E6;--paper:#FFFDF8;--gold:#E0A52E;--gold-deep:#B9821A;--gold-soft:#F6E6BE;
  --ink:#2B2012;--ink-soft:#7C6B50;--line:#EADCC0;--leaf:#5E7A4B;
  --shadow:0 10px 30px -12px rgba(70,50,15,.28);--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif}
body{min-height:100vh;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:1rem}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 140px}
.brand{display:flex;align-items:center;gap:14px;padding:10px 4px 22px}
.seal{width:58px;height:58px;flex:0 0 58px;filter:drop-shadow(0 4px 8px rgba(185,130,26,.35))}
.brand h1{font-size:1.5rem;font-weight:900;letter-spacing:-.01em;line-height:1.2}
.brand p{font-size:.86rem;color:var(--ink-soft);font-weight:500;margin-top:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:.78rem;font-weight:800;color:var(--gold-deep);margin-bottom:13px}
.eyebrow .num{width:22px;height:22px;border-radius:7px;background:var(--gold-soft);color:var(--gold-deep);display:grid;place-items:center;font-size:.74rem;font-weight:900}
.field-shop{position:relative}
select.shop{width:100%;appearance:none;background:var(--cream);border:1.5px solid var(--line);border-radius:13px;padding:15px 16px;font-weight:700;color:var(--ink);text-align:right}
select.shop:focus{outline:none;border-color:var(--gold);background:#fff}
.field-shop::after{content:"▾";position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gold-deep);font-size:.9rem;pointer-events:none}
.other-name{width:100%;margin-top:10px;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;font-weight:600}
.other-name:focus{outline:none;border-color:var(--gold)}
.prod{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:none}
.prod-name{font-weight:700;font-size:.98rem;flex:1}
.prod.active .prod-name{color:var(--gold-deep)}
.stepper{display:flex;align-items:center;gap:6px;background:var(--cream);border:1.5px solid var(--line);border-radius:12px;padding:4px}
.prod.active .stepper{border-color:var(--gold);background:#fff}
.stepper button{width:34px;height:34px;border-radius:9px;font-size:1.25rem;font-weight:800;color:var(--gold-deep);display:grid;place-items:center;line-height:1}
.stepper button:active{background:var(--gold-soft)}
.stepper input{width:62px;text-align:center;border:none;background:transparent;font-weight:800;font-size:1rem;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none}
.unit{font-size:.74rem;color:var(--ink-soft);font-weight:700;min-width:30px}
.bar{position:fixed;inset:auto 0 0 0;background:rgba(255,253,248,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:14px 16px;box-shadow:0 -8px 24px -16px rgba(70,50,15,.4)}
.bar-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar-info{flex:1}
.bar-info .big{font-weight:900;font-size:1.05rem}
.bar-info .small{font-size:.78rem;color:var(--ink-soft);font-weight:600}
.btn-submit{background:var(--gold);color:#3a2a08;font-weight:900;font-size:1.02rem;padding:15px 26px;border-radius:14px;box-shadow:0 6px 16px -6px var(--gold-deep);transition:.15s}
.btn-submit:hover:not(:disabled){background:var(--gold-deep);color:#fff}
.btn-submit:disabled{background:var(--line);color:var(--ink-soft);box-shadow:none;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:rgba(43,32,18,.55);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:24px}
.overlay.show{display:grid}
.confirm{background:var(--paper);border-radius:24px;max-width:430px;width:100%;padding:28px 24px;text-align:center;box-shadow:var(--shadow);position:relative;max-height:92vh;overflow:auto}
.stamp{width:86px;height:86px;margin:0 auto 10px}
.stamp.animate{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{transform:scale(1.7) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.confirm h2{font-size:1.3rem;font-weight:900;color:var(--leaf)}
.confirm .when{font-size:.85rem;color:var(--ink-soft);font-weight:600;margin-top:4px}
.summary{text-align:right;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0;font-size:.92rem}
.summary .row{display:flex;justify-content:space-between;padding:3px 0}
.summary .row.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:900}
.send-hint{font-size:.85rem;color:var(--ink-soft);font-weight:600;margin-bottom:12px}
.send-grid{display:grid;gap:10px}
.send-btn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;padding:14px;border-radius:13px;font-size:.98rem;border:1.5px solid var(--line)}
.send-btn.wa{background:#1f9d57;color:#fff;border-color:#1f9d57}
.send-btn.sms{background:#5b6470;color:#fff;border-color:#5b6470}
.send-btn.bale{background:#1aa6b7;color:#fff;border-color:#1aa6b7}
.send-btn.tg{background:#2b6ea8;color:#fff;border-color:#2b6ea8}
.send-btn.share{background:var(--gold-soft);color:var(--gold-deep);border-color:var(--gold)}
.send-btn.copy{background:var(--cream);color:var(--ink);border-color:var(--line);font-size:.86rem;padding:11px}
.send-btn.new{background:var(--ink);color:#fff;border-color:var(--ink);margin-top:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:999px;font-weight:700;font-size:.88rem;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:.75rem;color:var(--ink-soft);font-weight:600;padding:18px 0 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="47" fill="none" stroke="var(--gold)" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="var(--gold)" stroke-width="1" stroke-dasharray="2 4"/>
      <circle cx="50" cy="50" r="33" fill="var(--gold-soft)"/>
      <g transform="translate(50 52)">
        <path d="M-17 4 L-9 -10 L19 -10 L11 4 Z" fill="var(--gold)"/>
        <path d="M-17 4 L11 4 L11 13 L-17 13 Z" fill="var(--gold-deep)"/>
        <path d="M-9 -10 L19 -10 L11 4 L-17 4 Z" fill="#F2CE6B"/>
        <circle cx="1" cy="-3" r="2.4" fill="#FFF4D6"/>
      </g>
    </svg>
    <div>
      <h1 id="brandName">سفارش کره</h1>
      <p id="brandTag">سفارش را پر کنید و مستقیم برای ما بفرستید</p>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="eyebrow"><span class="num">۱</span> نام فروشگاه شما</div>
      <div class="field-shop">
        <select class="shop" id="shopSelect"><option value="" disabled selected>انتخاب کنید…</option></select>
      </div>
      <input class="other-name" id="otherName" placeholder="نام فروشگاه را تایپ کنید" style="display:none">
    </section>

    <section class="card">
      <div class="eyebrow"><span class="num">۲</span> کالاها و وزن (کیلوگرم)</div>
      <div id="prodList"></div>
    </section>

    <p class="foot">برای هر کالا، وزن موردنظر را به کیلوگرم وارد کنید.</p>
  </main>
</div>

<div class="bar" id="summaryBar">
  <div class="bar-inner">
    <div class="bar-info">
      <div class="big" id="barBig">۰ کیلوگرم</div>
      <div class="small" id="barSmall">نام و حداقل یک کالا را وارد کنید</div>
    </div>
    <button class="btn-submit" id="submitBtn" disabled>ادامه و ارسال</button>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="confirm">
    <svg class="stamp" id="stampSvg" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="var(--leaf)" stroke-width="3"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="var(--leaf)" stroke-width="1.5" stroke-dasharray="3 4"/>
      <path d="M34 51 l11 11 l22 -26" fill="none" stroke="var(--leaf)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2>سفارش شما آماده است</h2>
    <div class="when" id="confirmWhen"></div>
    <div class="summary" id="confirmSummary"></div>
    <p class="send-hint">برنامه‌ی دلخواه را بزنید؛ گفتگوی ما باز می‌شود و فقط «ارسال» را لمس کنید:</p>
    <div class="send-grid">
      <button class="send-btn wa"   id="waBtn"   style="display:none">🟢 ارسال در واتساپ</button>
      <button class="send-btn sms"  id="smsBtn"  style="display:none">💬 ارسال با پیام گوشی</button>
      <button class="send-btn bale" id="baleBtn" style="display:none">🔵 ارسال در بله</button>
      <button class="send-btn tg"   id="tgBtn"   style="display:none">✈️ ارسال در تلگرام</button>
      <button class="send-btn share" id="shareBtn" style="display:none">📤 برنامه‌های دیگر</button>
      <button class="send-btn copy" id="copyBtn">📋 کپی متن سفارش</button>
      <button class="send-btn new"  id="newOrderBtn">سفارش جدید</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   تنظیمات — این چند خط را با مشخصات خودت پر کن
   ============================================================ */
const BRAND   = "سفارش کره";
const TAGLINE = "سفارش را پر کنید و مستقیم برای ما بفرستید";

/* شماره‌ی موبایلِ تو با کد کشور و بدون + و بدون صفرِ اول.
   مثال برای ایران: 0912XXXXXXX  =>  98912XXXXXXX
   این شماره هم برای «واتساپ» و هم برای «پیام گوشی (SMS)» استفاده می‌شود. */
const OWNER_PHONE = "989125137139";

/* شماره برای «پیام گوشی (SMS)» — شکل محلی برای داخل ایران دقیق‌تر است */
const OWNER_SMS = "09125137139";

/* آیدی (نام کاربری) تو در بله، بدون @  — مثال: khorram_butter
   اگر آیدی نداری، از داخل بله در بخش پروفایل یک «شناسه کاربری» بساز. */
const OWNER_BALE = "omidkaji";

/* اختیاری: آیدی تلگرام بدون @ (اگر خالی بماند دکمه‌ی تلگرام نمایش داده نمی‌شود) */
const OWNER_TELEGRAM = "";

/* آدرس «وب‌اپِ» Google Apps Script برای ذخیره‌ی خودکار سفارش‌ها در Google Sheet.
   اگر خالی بماند، فقط ارسالِ دستی کار می‌کند و چیزی در شیت ذخیره نمی‌شود.
   (طبق راهنما این آدرس را می‌سازی و اینجا می‌گذاری.) */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxueA8pbWOnqTrA5URe2tq_NSgSLuqZoO-yRTQCtB_lO4_yDN6tpeUzXAlfrQgfbFEmlw/exec";

const CUSTOMERS = [
  "گلستانی","تاجیک","وزیری","موسوی","لشگری-لبن پخش باران",
  "اذهری-آیلین پخش آراد","رفیعی","محبی","حسینی چناران","حسن زاده",
  "برزگر","هوشنگی","دلگیر","رضازاده","پارسا",
  "محمودی","عارفخانی","قناد","میرزایی فردوس","توسعه روز خرم",
  "افق کوروش مشهد","غلامزاده","صباغیان","کمالی","خانم مجرد",
  "آریا شادفر","سعادتی قوچان","نورمحمدی-تایباد","کافه فرنوسا","پسران کریم","متفرقه"
];
const PRODUCTS = [
  "کره 250گرم","کره 100گرمی","کره 50گرمی","کره 25گرمی","کره 15گرمی",
  "کره 10گرمی","کره فرمسیل","کره 5کیلویی","کره فله 25کیلویی"
];
/* ============================================================ */

const $ = s => document.querySelector(s);
const faNum = n => Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2});
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
document.getElementById('brandName').textContent = BRAND;
document.getElementById('brandTag').textContent = TAGLINE;

function g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let gy2=gy-1600, gm2=gm-1, gd2=gd-1;
  let n=365*gy2+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400);
  n+=gdm[gm2]+gd2;
  if(gm>2 && ((gy%4===0 && gy%100!==0)||(gy%400===0))) n++;
  let jdn=n-79, jnp=Math.floor(jdn/12053); jdn%=12053;
  let jy=979+33*jnp+4*Math.floor(jdn/1461); jdn%=1461;
  if(jdn>=366){ jy+=Math.floor((jdn-1)/365); jdn=(jdn-1)%365; }
  const jdm=[31,31,31,31,31,31,30,30,30,30,30,29]; let jm=0;
  while(jm<11 && jdn>=jdm[jm]){ jdn-=jdm[jm]; jm++; }
  return [jy,jm+1,jdn+1];
}
function todayJalali(){ const d=new Date(); const [y,m,dd]=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
  return `${y}/${String(m).padStart(2,'0')}/${String(dd).padStart(2,'0')}`; }
function nowTime(){ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

const shopSelect=$('#shopSelect'), otherName=$('#otherName'), prodList=$('#prodList');
CUSTOMERS.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; shopSelect.appendChild(o); });
const otherOpt=document.createElement('option'); otherOpt.value='__other__'; otherOpt.textContent='سایر (وارد کردن دستی)'; shopSelect.appendChild(otherOpt);

const weights={};
PRODUCTS.forEach(p=>{
  weights[p]=0;
  const row=document.createElement('div'); row.className='prod';
  row.innerHTML=`<span class="prod-name">${p}</span>
    <div class="stepper">
      <button data-act="minus" aria-label="کم">−</button>
      <input type="number" inputmode="decimal" min="0" step="1" value="" placeholder="۰" aria-label="وزن ${p}">
      <button data-act="plus" aria-label="زیاد">+</button>
    </div><span class="unit">کیلو</span>`;
  prodList.appendChild(row);
  const inp=row.querySelector('input');
  row.querySelector('[data-act="plus"]').onclick=()=>{ inp.value=(parseFloat(inp.value)||0)+5; onWeight(p,inp,row); };
  row.querySelector('[data-act="minus"]').onclick=()=>{ inp.value=Math.max(0,(parseFloat(inp.value)||0)-5); onWeight(p,inp,row); };
  inp.oninput=()=>onWeight(p,inp,row);
});
function onWeight(p,inp,row){ let v=parseFloat(inp.value); if(isNaN(v)||v<0)v=0; weights[p]=v; row.classList.toggle('active',v>0); refreshBar(); }

shopSelect.onchange=()=>{ otherName.style.display = shopSelect.value==='__other__' ? 'block' : 'none'; refreshBar(); };
otherName.oninput=refreshBar;
function currentName(){ return shopSelect.value==='__other__' ? otherName.value.trim() : (shopSelect.value||''); }
function currentItems(){ return PRODUCTS.filter(p=>weights[p]>0).map(p=>({product:p,weight:weights[p]})); }

function refreshBar(){
  const items=currentItems(); const kg=items.reduce((s,i)=>s+i.weight,0);
  $('#barBig').textContent=faNum(kg)+' کیلوگرم';
  const name=currentName(); const ready=name && items.length>0;
  $('#submitBtn').disabled=!ready;
  if(!name) $('#barSmall').textContent='نام فروشگاه را انتخاب کنید';
  else if(items.length===0) $('#barSmall').textContent='حداقل یک کالا وارد کنید';
  else $('#barSmall').textContent=faNum(items.length)+' کالا انتخاب شده';
}

let orderText='';
function buildText(name,items,kg,date,time){
  let t='🧈 سفارش جدید\n';
  t+='👤 فروشگاه: '+name+'\n';
  t+='📅 '+date+' — ساعت '+time+'\n';
  t+='────────────\n';
  items.forEach(i=>{ t+='• '+i.product+': '+i.weight+' کیلو\n'; });
  t+='────────────\n';
  t+='جمع: '+kg+' کیلوگرم';
  return t;
}

function saveToSheet(order){
  if(!SHEET_URL) return;
  try{
    fetch(SHEET_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(order)
    }).catch(()=>{});
  }catch(e){}
}

$('#submitBtn').onclick=()=>{
  const name=currentName(), items=currentItems(); if(!name||items.length===0) return;
  const kg=items.reduce((s,i)=>s+i.weight,0), date=todayJalali(), time=nowTime();
  saveToSheet({customer:name, date, time, items, totalKg:kg});   // ذخیره‌ی خودکار در گوگل‌شیت
  orderText=buildText(name,items,kg,date,time);
  $('#confirmWhen').textContent=`${name} · ${date} · ساعت ${time}`;
  let html=''; items.forEach(i=>{ html+=`<div class="row"><span>${i.product}</span><span>${faNum(i.weight)} کیلو</span></div>`; });
  html+=`<div class="row total"><span>جمع</span><span>${faNum(kg)} کیلوگرم</span></div>`;
  $('#confirmSummary').innerHTML=html;
  $('#confirmOverlay').classList.add('show');
  const st=$('#stampSvg'); st.classList.remove('animate'); void st.offsetWidth; st.classList.add('animate');
};

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
async function copyText(silent){
  try{ await navigator.clipboard.writeText(orderText); if(!silent) toast('متن سفارش کپی شد ✅'); return true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=orderText; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    document.body.removeChild(ta);
    if(!silent) toast(ok?'متن سفارش کپی شد ✅':'کپی نشد؛ متن را دستی انتخاب کنید');
    return ok;
  }
}

/* ---- دکمه‌های ارسالِ مستقیم به مدیر ---- */
// واتساپ: گفتگوی مدیر + متن آماده
if(OWNER_PHONE){
  $('#waBtn').style.display='flex';
  $('#waBtn').onclick=()=>window.open('https://wa.me/'+OWNER_PHONE+'?text='+encodeURIComponent(orderText),'_blank');
  // پیام گوشی (SMS): به شماره‌ی مدیر + متن آماده
  $('#smsBtn').style.display='flex';
  $('#smsBtn').onclick=()=>{
    const sep = isIOS ? '&body=' : '?body=';
    window.location.href='sms:'+(OWNER_SMS||OWNER_PHONE)+sep+encodeURIComponent(orderText);
  };
}
// بله: گفتگوی مدیر باز می‌شود؛ بله متنِ آماده را پشتیبانی نمی‌کند، پس کپی می‌کنیم تا بچسباند
if(OWNER_BALE){
  $('#baleBtn').style.display='flex';
  $('#baleBtn').onclick=async()=>{
    await copyText(true);
    toast('متن کپی شد ✅ در گفتگوی ما بچسبانید و ارسال کنید');
    setTimeout(()=>window.open('https://ble.ir/'+OWNER_BALE,'_blank'),900);
  };
}
// تلگرام (اختیاری)
if(OWNER_TELEGRAM){
  $('#tgBtn').style.display='flex';
  $('#tgBtn').onclick=async()=>{
    await copyText(true);
    toast('متن کپی شد ✅ در گفتگو بچسبانید و ارسال کنید');
    setTimeout(()=>window.open('https://t.me/'+OWNER_TELEGRAM,'_blank'),900);
  };
}
// برنامه‌های دیگر (پنجره‌ی اشتراک‌گذاری گوشی) — فقط اگر مرورگر پشتیبانی کند
if(navigator.share){
  $('#shareBtn').style.display='flex';
  $('#shareBtn').onclick=async()=>{
    try{ await navigator.share({title:'سفارش کره', text:orderText}); }
    catch(e){ if(e && e.name==='AbortError') return; toast('اشتراک‌گذاری ممکن نشد؛ از دکمه‌های دیگر استفاده کنید'); }
  };
}
$('#copyBtn').onclick=()=>copyText(false);

$('#newOrderBtn').onclick=()=>{
  $('#confirmOverlay').classList.remove('show');
  shopSelect.selectedIndex=0; otherName.value=''; otherName.style.display='none';
  PRODUCTS.forEach(p=>weights[p]=0);
  document.querySelectorAll('.prod').forEach(r=>{ r.classList.remove('active'); r.querySelector('input').value=''; });
  refreshBar(); window.scrollTo({top:0,behavior:'smooth'});
};

refreshBar();
</script>
</body>
</html>
